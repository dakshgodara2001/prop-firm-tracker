<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PFDI Terminal{% endblock %}</title>
<style>
  /* Design tokens for the light-on-dark terminal UI. Flow badges always carry
     a text label, so colour is never the only cue. */
  :root {
    --bg:#0a0d12; --surface:#0f141b; --surface-2:#0c1017; --inset:#080b10;
    --ink:#dbe2ec; --ink-2:#93a0b4; --ink-3:#5c6a7e;
    --line:#1c2531; --line-2:#141b25;
    --accent:#e8b339; --accent-dim:#8a6a1e; --link:#6ea8fe;
    --buy:#199e70; --sell:#e66767; --pbuy:#3987e5; --psell:#d95926;
    --mixed:#9085e9; --churn:#4d5a6b; --churn-ink:#aab6c6;
    --mono:"SF Mono",SFMono-Regular,ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--ink); background:var(--bg); }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  code { background:var(--inset); padding:1px 5px; border-radius:3px; font:11.5px var(--mono); }

  header.site { background:var(--inset); border-bottom:1px solid var(--line); padding:8px 18px;
                display:flex; gap:24px; align-items:center; position:sticky; top:0; z-index:9; }
  .brand { font:700 12px var(--mono); color:var(--accent); letter-spacing:.12em; }
  .brand b { color:var(--ink); font-weight:700; }
  header.site nav { margin-left:auto; }
  header.site nav a { color:var(--ink-2); margin-left:18px; font-size:11px; text-transform:uppercase;
                      letter-spacing:.09em; font-weight:600; }
  header.site nav a:hover { color:var(--ink); text-decoration:none; }

  main { max-width:1360px; margin:16px auto 60px; padding:0 16px; }
  h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:.01em; }
  h2 { font:700 10.5px var(--mono); margin:22px 0 6px; color:var(--ink-3);
       text-transform:uppercase; letter-spacing:.14em; }
  h2 .amber { color:var(--accent); }
  .sub { color:var(--ink-2); font-size:12px; }

  .panel, .card { background:var(--surface); border:1px solid var(--line); border-radius:6px;
           padding:10px 12px; margin-bottom:12px; overflow-x:auto; }
  .panel.tight { padding:6px 8px; }

  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:left; padding:5px 9px; border-bottom:1px solid var(--line-2); white-space:nowrap; }
  td.wrap, th.wrap { white-space:normal; }
  th { color:var(--ink-3); font:600 10px var(--mono); text-transform:uppercase; letter-spacing:.1em; }
  tbody tr:hover td { background:#121926; }
  .num { text-align:right; font:12px var(--mono); font-variant-numeric:tabular-nums; }
  .pos { color:var(--buy); } .neg { color:var(--sell); }

  .badge { display:inline-block; padding:1px 7px; border-radius:3px; font:700 10px var(--mono);
           letter-spacing:.05em; color:#08130e; }
  .flow-CLEAN_BUY  { background:var(--buy); }
  .flow-CLEAN_SELL { background:var(--sell); color:#1b0808; }
  .flow-NET_BUY    { background:var(--pbuy); color:#071120; }
  .flow-NET_SELL   { background:var(--psell); color:#1c0d05; }
  .flow-MIXED      { background:var(--mixed); color:#120e26; }
  .flow-ROUND_TRIP { background:var(--churn); color:var(--churn-ink); }

  .attn-wrap { display:inline-flex; align-items:center; gap:7px; }
  .attn-num { font:700 12px var(--mono); color:var(--ink); min-width:22px; text-align:right; }
  .meter { width:52px; height:5px; background:var(--inset); border-radius:2px; overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--accent); border-radius:2px; }
  .meter.low i { background:var(--accent-dim); }

  .split { display:inline-flex; width:64px; height:7px; border-radius:2px; overflow:hidden;
           background:var(--inset); vertical-align:middle; }
  .split i { display:block; height:100%; }
  .split .b { background:var(--buy); }
  .split .s { background:var(--sell); margin-left:2px; } /* 2px surface gap between fills */

  .tag { font:700 9.5px var(--mono); letter-spacing:.06em; padding:1px 5px; border-radius:3px;
         border:1px solid var(--line); color:var(--ink-2); margin-left:4px; }
  .tag.new { color:var(--accent); border-color:var(--accent-dim); }

  .kpis { display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:6px;
          background:var(--surface); margin:10px 0 12px; }
  .kpi { padding:8px 16px 7px; border-right:1px solid var(--line-2); min-width:92px; }
  .kpi:last-child { border-right:0; }
  .kpi .v { font:700 17px var(--mono); font-variant-numeric:tabular-nums; }
  .kpi .k { color:var(--ink-3); font:600 9px var(--mono); text-transform:uppercase; letter-spacing:.12em; margin-top:1px; }
  .kpi .v .unit { font-size:11px; color:var(--ink-3); font-weight:600; }
  .kpi.spark { display:flex; align-items:flex-end; gap:3px; padding:8px 14px 9px; }
  .spark .col { width:9px; background:var(--accent); opacity:.32; border-radius:2px 2px 0 0; min-height:2px; }
  .spark .col.cur { opacity:1; }

  .stance { border-left:2px solid var(--accent); padding:7px 12px; background:var(--surface-2);
            font-size:13px; margin:10px 0 0; color:var(--ink); }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .chip { font:600 10.5px var(--mono); letter-spacing:.05em; text-transform:uppercase;
          padding:4px 10px; border:1px solid var(--line); border-radius:99px; color:var(--ink-2);
          background:var(--surface); cursor:pointer; user-select:none; }
  .chip:hover { color:var(--ink); border-color:var(--ink-3); }
  .chip.on { color:var(--bg); background:var(--accent); border-color:var(--accent); font-weight:700; }
  .chip .n { opacity:.65; margin-left:4px; }

  .layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:14px; }
  @media (max-width:1020px){ .layout { grid-template-columns:1fr; } }
  .rail .panel { padding:9px 11px; }
  .rail ul { margin:4px 0 2px; padding-left:0; list-style:none; }
  .rail li { margin-bottom:7px; font-size:12px; color:var(--ink-2); }
  .rail li b, .rail li strong { color:var(--ink); font-weight:600; }
  .ellip { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { font-size:9px; vertical-align:1px; }
  .prio-1 { color:var(--sell); } .prio-2 { color:var(--psell); } .prio-3 { color:var(--ink-3); }
  .alert-type { font:700 9.5px var(--mono); letter-spacing:.05em; color:#9db4d8;
                background:#16202f; padding:1px 6px; border-radius:3px; text-transform:uppercase; }
  .check li::before { content:"☐ "; color:var(--accent); }
  .rank { font:700 11px var(--mono); color:var(--ink-3); margin-right:6px; }

  tr.xrow { cursor:pointer; }
  tr.xrow td:first-child::before { content:"›"; color:var(--ink-3); display:inline-block;
                                   width:12px; transition:transform .12s; }
  tr.xrow.open td:first-child::before { transform:rotate(90deg); color:var(--accent); }
  tr.xdetail { display:none; }
  tr.xdetail.show { display:table-row; }
  tr.xdetail td { background:var(--surface-2); white-space:normal; color:var(--ink-2);
                  font-size:12.5px; padding:9px 12px 10px 30px; }
  tr.xdetail td b { color:var(--ink); }

  details.audit { border:1px solid var(--line); border-radius:6px; background:var(--surface);
                  margin-bottom:12px; }
  details.audit summary { cursor:pointer; padding:9px 12px; font:700 10.5px var(--mono);
                          text-transform:uppercase; letter-spacing:.12em; color:var(--ink-3); }
  details.audit summary:hover { color:var(--ink); }
  details.audit .inner { padding:2px 12px 12px; overflow-x:auto; }

  input.filter { padding:6px 10px; border:1px solid var(--line); border-radius:5px; width:280px;
                 margin-bottom:12px; background:var(--surface-2); color:var(--ink); }
  .tiles { display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--line); border-radius:6px;
           background:var(--surface); margin:10px 0; }
  .tile { padding:8px 16px 7px; border-right:1px solid var(--line-2); min-width:100px; background:none; }
  .tile:last-child { border-right:0; }
  .tile .v { font:700 16px var(--mono); }
  .tile .k { color:var(--ink-3); font:600 9px var(--mono); text-transform:uppercase; letter-spacing:.12em; }
  .attn { display:inline-block; min-width:30px; text-align:center; padding:1px 6px; border-radius:3px;
          background:#1a2233; color:var(--accent); font:700 11.5px var(--mono); }
  .star { color:var(--accent); font-weight:700; }
  .muted { color:var(--ink-2); }
  .note { color:var(--ink-3); font-size:11.5px; margin-top:7px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:950px){ .grid { grid-template-columns:1fr; } }
  ul.explain { padding-left:18px; margin:8px 0; } ul.explain li { margin-bottom:8px; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; font:11px var(--mono); color:var(--ink-2); }
  .legend i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  svg text { fill:var(--ink-2); }
  .datebar a { margin-right:9px; font:600 11px var(--mono); }
  .datebar .cur { color:var(--accent); font:700 11px var(--mono); margin-right:9px; }
  .disclaimer { color:var(--ink-3); font-size:10.5px; margin-top:26px; border-top:1px solid var(--line);
                padding-top:9px; }
</style>
</head>
<body>
<header class="site">
  <span class="brand">PFDI<b>/</b>PROP-FIRM DEAL INTELLIGENCE</span>
  <nav>
    <a href="{{ url_for('dashboard') }}">Command Center</a>
    <a href="{{ url_for('stocks_index') }}">Stocks</a>
    <a href="{{ url_for('firms_index') }}">Firms</a>
    <a href="{{ url_for('alerts_page') }}">Alerts</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
<p class="disclaimer">ATTENTION SCORES AND ALERTS RANK TRACKED-FIRM ACTIVITY — not buy/sell advice, no return prediction.
Sources: NSE (primary) &amp; BSE (secondary) official disclosures.</p>
</main>
</body>
</html>
